---
# defaults/main.yml — netops_health role
# CPU/memory can currently be evaluated using observed measurement evidence.
# Interface/BGP data are not health-certified by the facts module. They are
# opt-in inventory-only collections and are rejected as safety checks.
netops_health_check_cpu: true
netops_health_check_memory: true
netops_health_check_interfaces: false
netops_health_check_bgp: false
netops_health_check_ospf: false

# Measurements at or above these thresholds are CRITICAL.
netops_health_cpu_critical: 90
netops_health_memory_critical: 90

# Strict mode requires observed CPU/memory and fails on UNKNOWN/CRITICAL.
# With false, this role collects observations but never certifies health.
netops_health_fail_on_critical: true

netops_health_report_path: ""

netops_health_username: "{{ ansible_user | default(omit) }}"
netops_health_password: "{{ ansible_password | default(omit) }}"
netops_health_port: "{{ ansible_port | default(22) }}"
netops_health_vendor: "{{ ansible_network_os | default('cisco_ios') }}"
