name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release version metadata
        run: python scripts/sync_version.py --check

      - name: Install dependencies
        run: pip install -e ".[dev,report,tui]"

      - name: Lint (ruff)
        run: python -m ruff check netops/ tests/

      - name: Type check (mypy)
        run: python -m mypy netops/

      - name: Tests (pytest + coverage)
        run: python -m pytest --tb=short -q

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Audit dependencies (pip-audit)
        run: pip-audit .

  tui-python-314:
    name: TUI compatibility (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install TUI test dependencies
        run: pip install -e ".[dev,tui]"

      - name: Exercise TUI keyboard and terminal profile checks
        run: python -m pytest --no-cov -q tests/test_tui_smoke.py tests/test_tui_mouse.py tests/test_tui_terminal.py
