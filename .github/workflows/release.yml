name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]
      target_version:
        description: 'Exact version (MAJOR.MINOR.PATCH). Overrides bump logic.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Prevent release loops
    if: "!contains(github.event.head_commit.message, '[skip-release]') && !contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from commit message
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_BUMP: ${{ github.event.inputs.bump }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$WORKFLOW_BUMP" >> "$GITHUB_OUTPUT"
          else
            MSG="$HEAD_COMMIT_MESSAGE"
            if echo "$MSG" | grep -qiE '^feat!:|BREAKING CHANGE'; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif echo "$MSG" | grep -qiE '^feat'; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Calculate and synchronize release version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          TARGET_VERSION: ${{ github.event.inputs.target_version }}
        run: |
          python scripts/sync_version.py --check
          CURRENT=$(python scripts/sync_version.py --current)

          if [ -n "$TARGET_VERSION" ]; then
            NEW="$TARGET_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            case "$BUMP_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "Unsupported bump type: $BUMP_TYPE" >&2; exit 1 ;;
            esac

            NEW="${MAJOR}.${MINOR}.${PATCH}"
          fi

          python scripts/sync_version.py --version "$NEW"
          python scripts/sync_version.py --check
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bump: ${BUMP_TYPE} ($CURRENT → $NEW)"

      - name: Build release archives
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          NAME="netops-toolkit-${VERSION}"

          # Build a clean release directory with everything users need
          mkdir -p "/tmp/${NAME}"
          cp -r netops/     "/tmp/${NAME}/"
          cp -r docs/       "/tmp/${NAME}/"
          cp -r examples/   "/tmp/${NAME}/"
          cp -r tests/      "/tmp/${NAME}/"
          cp README.md      "/tmp/${NAME}/"
          cp pyproject.toml "/tmp/${NAME}/"
          cp install.sh     "/tmp/${NAME}/"
          cp install.ps1    "/tmp/${NAME}/"
          cp LICENSE        "/tmp/${NAME}/" 2>/dev/null || true

          # tar.gz (primary — for air-gapped/jumpbox install)
          cd /tmp
          tar czf "${GITHUB_WORKSPACE}/${NAME}.tar.gz" "${NAME}/"
          zip -qr "${GITHUB_WORKSPACE}/${NAME}.zip" "${NAME}/"
          cd "${GITHUB_WORKSPACE}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          tar tzf "${NAME}.tar.gz" | grep -F "${NAME}/install.sh"
          unzip -l "${NAME}.zip" | grep -F "${NAME}/install.ps1"

          echo "### 📦 Release archive" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${NAME}.tar.gz\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${NAME}.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Contents: netops/ (with TUI), docs/, examples/, tests/, README, pyproject.toml" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml netops/__init__.py
          git commit -m "chore(release): v${{ steps.version.outputs.new }} [skip-release]"
          git tag -a "v${{ steps.version.outputs.new }}" -m "Release v${{ steps.version.outputs.new }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.new }}"
          make_latest: true
          body: |
            ## netops-toolkit v${{ steps.version.outputs.new }}

            ### 📥 One-command install

            ```bash
            curl -sSL https://raw.githubusercontent.com/plures/netops-toolkit/main/install.sh | bash
            ```

            Then:
            ```bash
            source ~/.venv/netops/bin/activate
            netops-tui
            ```

            ### Windows (no administrator rights)

            Download `netops-toolkit-${{ steps.version.outputs.new }}.zip`, extract it, then run:

            ```powershell
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\netops-toolkit-${{ steps.version.outputs.new }}\install.ps1"
            ```

            The installer creates a per-user virtual environment under `%LOCALAPPDATA%\netops-toolkit` and adds a Start menu shortcut for `netops-tui`.

            ### 📥 Air-gapped / offline

            ```bash
            # Copy the tarball to the target machine, then:
            tar xzf netops-toolkit-${{ steps.version.outputs.new }}.tar.gz
            cd netops-toolkit-${{ steps.version.outputs.new }}
            ./install.sh
            ```

            ### Requirements

            - Python >= 3.9
            - No sudo needed (installs to ~/.venv/netops)

            **Full Changelog**: https://github.com/plures/netops-toolkit/compare/v${{ steps.version.outputs.current }}...v${{ steps.version.outputs.new }}
          files: |
            netops-toolkit-${{ steps.version.outputs.new }}.tar.gz
            netops-toolkit-${{ steps.version.outputs.new }}.tar.gz.sha256
            netops-toolkit-${{ steps.version.outputs.new }}.zip
            netops-toolkit-${{ steps.version.outputs.new }}.zip.sha256
